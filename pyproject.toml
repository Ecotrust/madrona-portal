[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "madrona-portal"
version = "4.0.2.02"
description = "MARCO Mid-Atlantic Ocean Data Portal"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

# Runtime dependencies are managed in requirements.txt / docker-requirements.txt.
# This section is intentionally minimal — the project is not distributed as a
# standalone package, so pip-installable metadata is kept lightweight.
dependencies = []

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "marco.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--strict-markers -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["portal", "marco", "marco_site"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Ruff (linting + formatting — replaces flake8, isort, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "bower_components",
    "*/migrations/*",
    "node_modules",
    "static",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = [
    "E501",   # line too long — handled by formatter
    "DJ001",  # Avoid using null=True on string-based fields — existing models
]

[tool.ruff.lint.isort]
known-first-party = ["marco", "marco_site", "portal"]

# ---------------------------------------------------------------------------
# Mypy (optional static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/", "bower_components/", "static/"]

[tool.django-stubs]
django_settings_module = "marco.settings"
