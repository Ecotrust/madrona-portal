# source: https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-docker-hub-and-github-packages
name: Create and publish West Coast Ocean Data Portal (WCODP) Docker image 

# Builds a single Docker image from the full workspace (madrona-portal +
# all madrona-apps sub-repos) and pushes it to GitHub Container Registry.
#
# Image: ghcr.io/ecotrust/madrona-portal:<sha>  (and :latest)

on:
  push:
    branches: ['docker']
      # TODO: switch to main branch once we're ready to build from there
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # -----------------------------------------------------------------------
      # Checkout madrona-portal into madrona-portal/ so the Dockerfile's COPY
      # paths (e.g. COPY madrona-portal/marco ...) resolve correctly.
      # -----------------------------------------------------------------------
      - name: Checkout madrona-portal
        uses: actions/checkout@v5
        with:
          path: madrona-portal

      # -----------------------------------------------------------------------
      # Checkout all sub-apps into madrona-apps/<name>/ — mirrors the local
      # workspace layout the Dockerfile expects.
      # GH_PAT must have read access to all sub-app repos in the Ecotrust org.
      # -----------------------------------------------------------------------
      - name: Checkout django_url_shortener
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/django_url_shortener
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/django_url_shortener

      - name: Checkout madrona-analysistools
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/madrona-analysistools
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/madrona-analysistools

      - name: Checkout madrona-features
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/madrona-features
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/madrona-features

      - name: Checkout madrona-manipulators
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/madrona-manipulators
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/madrona-manipulators

      - name: Checkout madrona-scenarios
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/madrona-scenarios
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/madrona-scenarios

      - name: Checkout mp-accounts
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-accounts
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-accounts

      - name: Checkout mp-data-manager
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-data-manager
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-data-manager

      - name: Checkout mp-drawing
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-drawing
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-drawing

      - name: Checkout mp-explore
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-explore
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-explore

      - name: Checkout mp-layers
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-layers
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-layers

      - name: Checkout mp-map-groups
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-map-groups
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-map-groups

      - name: Checkout mp-proxy
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-proxy
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-proxy

      - name: Checkout mp-survey
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-survey
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-survey

      - name: Checkout mp-visualize
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/mp-visualize
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/mp-visualize

      - name: Checkout p97-nursery
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/p97-nursery
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/p97-nursery

      # wcoa uses the vagrant2docker branch (contains Docker-specific config)
      - name: Checkout wcoa
        uses: actions/checkout@v5
        with:
          repository: Ecotrust/wcoa
          # TODO: change to main branch once Docker-specific config is merged there
          ref: vagrant2docker
          token: ${{ secrets.GH_PAT }}
          path: madrona-apps/wcoa
      
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Set lowercase image name
        run: |
          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
      
      # -----------------------------------------------------------------------
      # Docker setup
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: |
          cd madrona-portal
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Build from workspace root — matches the layout the Dockerfile expects.
      # Pushing :sha and :latest together so EC2 can pin a specific build or
      # always pull the newest with :latest.
      # -----------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: madrona-portal/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest summary
        run: |
          echo "### Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
