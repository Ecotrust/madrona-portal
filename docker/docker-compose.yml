# Madrona Portal — Docker Compose (WCOA)
#
# Quick start (full Docker stack):
#   cp ../.env.example ../.env   # then fill in real values
#   docker compose -f docker/docker-compose.yml --profile full up --build
#
# Dev infrastructure only (db + Redis, for use with local Django dev server):
#   docker compose -f docker/docker-compose.yml up
#   python marco/manage.py runserver  # in a separate terminal

services:

  app:
    # image: madrona-portal-app:latest
    build:
      context: ../../
      dockerfile: madrona-portal/docker/Dockerfile
    volumes:
      - static_data:/vol/web
      - ./media:/usr/local/apps/madrona-portal/media
      # Mount the main Django project tree from the host.
      # Changes to Python, templates, and config files are live immediately.
      - ../marco:/usr/local/apps/madrona-portal/marco

      # Mount the WCOA app package from the host.
      - ../../madrona-apps/wcoa:/usr/local/apps/madrona-portal/apps/wcoa

      # Mount other madrona-apps packages you are actively developing.
      # Comment out any you are NOT changing — using the baked image copy
      # for those packages is faster and avoids unnecessary inotify watches.
      - ../../madrona-apps/mp-data-manager:/usr/local/apps/madrona-portal/apps/mp-data-manager
      - ../../madrona-apps/mp-layers:/usr/local/apps/madrona-portal/apps/mp-layers
      - ../../madrona-apps/mp-accounts:/usr/local/apps/madrona-portal/apps/mp-accounts
      - ../../madrona-apps/mp-drawing:/usr/local/apps/madrona-portal/apps/mp-drawing
      - ../../madrona-apps/mp-visualize:/usr/local/apps/madrona-portal/apps/mp-visualize
      - ../../madrona-apps/madrona-features:/usr/local/apps/madrona-portal/apps/madrona-features
      - ../../madrona-apps/madrona-manipulators:/usr/local/apps/madrona-portal/apps/madrona-manipulators
      - ../../madrona-apps/madrona-scenarios:/usr/local/apps/madrona-portal/apps/madrona-scenarios
      - ../../madrona-apps/mp-map-groups:/usr/local/apps/madrona-portal/apps/mp-map-groups
      - ../../madrona-apps/mp-explore:/usr/local/apps/madrona-portal/apps/mp-explore
      - ../../madrona-apps/mp-proxy:/usr/local/apps/madrona-portal/apps/mp-proxy
      - ../../madrona-apps/p97-nursery:/usr/local/apps/madrona-portal/apps/p97-nursery
      - ../../madrona-apps/django_url_shortener:/usr/local/apps/madrona-portal/apps/django_url_shortener
      - ../../madrona-apps/madrona-analysistools:/usr/local/apps/madrona-portal/apps/madrona-analysistools
    env_file:
      - ./.env            # load all secrets from the docker/.env file
    environment:
      # DB_INIT=1 runs migrations, fixtures, and superuser creation on startup.
      # Defaults to 0 (skip) to protect existing databases.
      - DB_INIT=${DB_INIT:-0}

      - DEBUG=True
      # Config file selection — override specific values via env vars below.
      - MP_PROJECT_CONFIG=${MP_PROJECT_CONFIG:-config.wcoa.docker.ini}

      # Core Django
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      - DEBUG=${DEBUG:-True}

      # Database (DB_* preferred; SQL_* aliases kept for legacy compatibility)
      - DB_ENGINE=${DB_ENGINE:-django.contrib.gis.db.backends.postgis}
      - DB_NAME=${DB_NAME:-wcoa_docker_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432

      # Redis — single URL used for cache, Celery broker, and result backend.
      # Auth segment (:password@) is included only when REDIS_PASSWORD is set.
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/1
      - CELERY_BROKER_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/0

      # Superuser bootstrap — only creates if username doesn't already exist.
      # Leave DJANGO_SUPERUSER_PASSWORD empty to skip (safe for production).
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}

      # Application server mode
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      tasks:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${GUNICORN_PORT:-8008}:8008"
    networks:
      - djangonetwork
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgis_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-wcoa_docker_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - djangonetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wcoa_docker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tasks:
    image: redis:7-alpine
    # Only pass --requirepass when REDIS_PASSWORD is non-empty.
    # An empty REDIS_PASSWORD causes "wrong number of arguments" in Redis 7.
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - djangonetwork
    healthcheck:
      # -a flag is only passed when a password is configured.
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  static_data:
  postgis_data:
  redis_data:

networks:
  djangonetwork:
    driver: bridge
